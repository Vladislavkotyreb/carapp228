name: AppMVP
options:
  bundleIdPrefix: com.vladislavkotyrev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AppMVP:
    type: application
    platform: iOS
    sources:
      - path: AppMVP
    resources:
      - path: Config.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vladislavkotyrev.appmvp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Beepy
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Supabase
        product: Supabase

schemes:
  AppMVP:
    build:
      targets:
        AppMVP: all
    run:
      config: Debug
    archive:
      config: Release
